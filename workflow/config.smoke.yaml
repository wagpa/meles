dataset: data/ytfaces_smoke.parquet
result_dir: results_smoke
log_dir: logs_smoke
split_k: 3
split_shuffle: True

# The same shape as the full experiment, with one recognizer and a smaller aggregator sweep.
experiment:
  name: smoke
  samples:
    frame_anonymizer:
    - none
    - gaussianblur
    - blackbar
    - pixelation
    frame_recognizer: arcface
    frame_aggregator: none
  gallery:
    frame_anonymizer:
    - none
    frame_aggregator:
    - none
    - pooling_mean
    - consensus_beta1
