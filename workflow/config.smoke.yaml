dataset: data/ytfaces_smoke.parquet
result_dir: results_smoke
log_dir: logs_smoke
split_k: 3
split_shuffle: True

# The same shape as the full experiment, with one recognizer and a smaller aggregator sweep.
experiment:
  name: smoke
  samples:
    frame_anonymizer:
    - none
    - gaussianblur
    - blackbar
    - pixelation
    frame_aggregator: video_none
    frame_recognizer: arcface
    embedding_aggregator: video_none
  gallery:
    frame_anonymizer:
    - none
    embedding_aggregator:
    - video_none
    - video_pooling_mean
    - identity_pooling_mean
  # '{gallery}_{samples}': how the gallery rows of one identity become its score, and how the
  # observations of one query video become one decision. 'max_none' does not fuse at all and is the
  # single-observation floor; 'max_mean' averages the observations of a video.
  score_aggregator:
  - max_none
  - max_mean
