# The structure file describing the dataset. It is a Pandas dataframe with one entry per (clear) video frame for each
# identity and video. The frames are referenced by their (relative) path. It has at least the following columns:
# - identity: the identity of the person in the video
# - video: the name of the video
# - frame: the name of the frame
# - path: the path to the frame image relative to the structure file
dataset: data/ytfaces.parquet

# The directory where the results and logs will be saved.
result_dir: results
log_dir: logs

# The number of folds for the k-fold cross-validation.
split_k: 3
split_shuffle: True

experiment:
  # Fusion levels against a clear gallery. The samples leg deliberately does NOT aggregate embeddings, so that the
  # 'score_aggregator' axis is the only thing fusing observations and 'max_none' is a genuine one-observation floor.
  # The gallery leg varies only its cardinality (one row per frame vs one row per identity per fold), which is the
  # comparison the 'max' gallery collapse was introduced to make fair.
  # Grid: 4 samples x 2 gallery x 3 score = 24 scoring jobs, all over aggregate_embedding outputs that already exist.
