# The structure file describing the dataset. It is a Pandas dataframe with one entry per (clear) video frame for each
# identity and video. The frames are referenced by their (relative) path. It has at least the following columns:
# - identity: the identity of the person in the video
# - video: the name of the video
# - frame: the name of the frame
# - path: the path to the frame image relative to the structure file
dataset: data/ytfaces.parquet

# The directory where the results and logs will be saved.
result_dir: results
log_dir: logs

# The number of folds for the k-fold cross-validation.
split_k: 3
split_shuffle: True

# The anonymization methods (with implicit parametrization) to be tested.
anonymization_methods:
- none
- gaussianblur
- blackbar
- pixelation

# The frame-level embedding models (with implicit parametrization) to be tested.
frame_embedding_methods:
- sface
- ghostfacenet
- arcface
#- vggface
#- facenet512
#- facenet
#- deepid
#- openface

# The video-level embedding models (with implicit parametrization) to be tested.
video_embedding_methods:
- dummy1
- dummy2
- dummy3

# The video-level aggregation methods (with implicit parametrization) to be tested.
video_aggregation_methods:
- none
- pooling_mean
#- pooling_min
#- pooling_max
#- pooling_median
#- clustering_mean_d1_min3
#- clustering_mean_d08_min3
#- clustering_median_d1_min3
#- clustering_median_d08_min3
- consensus_beta1
#- consensus_beta5
#- consensus_beta20

# The video-level aggregation methods (with implicit parametrization) to be tested.
identity_aggregation_methods:
- none
- pooling_mean
#- pooling_min
#- pooling_max
#- pooling_median
#- clustering_median_d1_min3
#- clustering_mean_d1_min3
#- clustering_median_d08_min3
#- clustering_mean_d08_min3
- consensus_beta1
#- consensus_beta5
#- consensus_beta20
