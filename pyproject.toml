[project]
name = "meles"
version = "0.1.0"
description = "Reversing video anonymization via aggregation attacks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "deepface>=0.0.100",
    "diskcache>=5.6.3",
    "fastparquet>=2026.5.0",
    "matplotlib>=3.11.0",
    "numpy",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.4",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "snakemake>=9.23.1",
    "snakevision>=1.1.0",
    "tf-keras>=2.21.0",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
    "nbstripout",
    "ty>=0.0.53",
    "ruff>=0.15.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meles"]
include = ["src/meles/py.typed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
